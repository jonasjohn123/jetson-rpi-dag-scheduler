  detect:
    command: "python workloads/vision/detect.py"
    preferred: gpu

    inputs:
      - tensor.npy
      - metadata.json

    outputs:
      - boxes.json
      - confidence.json

    artifact_sizes_mb:
      boxes.json: 1
      confidence.json: 1

  log:
    command: "python workloads/vision/log.py"
    preferred: cpu

    inputs:
      - boxes.json
      - confidence.json

    outputs: []

    artifact_sizes_mb: {}

  generate:
    command: "python workloads/branching/generate.py"
    preferred: cpu

    inputs: []

    outputs:
      - data.bin

    artifact_sizes_mb:
      data.bin: 1


  branch_a:
    command: "python workloads/branching/branch_a.py"
    preferred: cpu

    inputs:
      - data.bin

    outputs:
      - result_a.bin

    artifact_sizes_mb:
      result_a.bin: 2


  branch_b:
    command: "python workloads/branching/branch_b.py"
    preferred: cpu

    inputs:
      - data.bin

    outputs:
      - result_b.bin

    artifact_sizes_mb:
      result_b.bin: 3


  merge:
    command: "python workloads/branching/merge.py"
    preferred: cpu

    inputs:
      - result_a.bin
      - result_b.bin

    outputs:
      - merged.txt

    artifact_sizes_mb:
      merged.txt: 0.001

  capture:
    command: >
      python workloads/industrial_safety/capture.py
      --source test_images/frame.jpg
      --output artifacts/{workflow}/capture/frame.jpg

    outputs:
      - frame.jpg

    artifact_sizes_mb:
      frame.jpg: 0.8


  preprocess:
    command: >
      python workloads/industrial_safety/preprocess.py
      --input artifacts/workflow_001/capture/frame.jpg
      --output artifacts/workflow_001/preprocess/preprocessed.jpg

    inputs:
      - frame.jpg

    outputs:
      - preprocessed.jpg

    artifact_sizes_mb:
      preprocessed.jpg: 0.5


  detect_person:
    command: >
      python workloads/industrial_safety/detect_person.py
      --input artifacts/workflow_001/preprocess/preprocessed.jpg
      --output artifacts/workflow_001/detect_person/persons.json

    inputs:
      - preprocessed.jpg

    outputs:
      - persons.json

    artifact_sizes_mb:
      persons.json: 0.001


  detect_helmet:
    command: >
      python workloads/industrial_safety/detect_helmet.py
      --input artifacts/workflow_001/preprocess/preprocessed.jpg
      --output artifacts/workflow_001/detect_helmet/helmets.json

    inputs:
      - preprocessed.jpg

    outputs:
      - helmets.json

    artifact_sizes_mb:
      helmets.json: 0.001


  decide:
    command: >
      python workloads/industrial_safety/decide.py
      --persons artifacts/workflow_001/detect_person/persons.json
      --helmets artifacts/workflow_001/detect_helmet/helmets.json
      --output artifacts/workflow_001/decide/report.txt

    inputs:
      - persons.json
      - helmets.json

    outputs:
      - report.txt

    artifact_sizes_mb:
      report.txt: 0.001