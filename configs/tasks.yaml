tasks:

  capture:
    command: "python workloads/industrial_safety/capture.py --source datasets/safety/worker.jpg --output {output:frame.jpg}"

    outputs:
      - frame.jpg

    artifact_sizes_mb:
      frame.jpg: 0.8


  preprocess:
    command: "python workloads/industrial_safety/preprocess.py --input {input:frame.jpg} --output {output:preprocessed.jpg}"

    inputs:
      - frame.jpg

    outputs:
      - preprocessed.jpg

    artifact_sizes_mb:
      preprocessed.jpg: 0.5


  detect_person:
    command: "python workloads/industrial_safety/detect_person.py --input {input:preprocessed.jpg} --output {output:persons.json}"

    inputs:
      - preprocessed.jpg

    outputs:
      - persons.json

    artifact_sizes_mb:
      persons.json: 0.001


  detect_helmet:
    command: "python workloads/industrial_safety/detect_helmet.py --input {input:preprocessed.jpg} --output {output:helmets.json}"

    inputs:
      - preprocessed.jpg

    outputs:
      - helmets.json

    artifact_sizes_mb:
      helmets.json: 0.001


  decide:
    command: "python workloads/industrial_safety/decide.py --persons {input:persons.json} --helmets {input:helmets.json} --output {output:report.txt}"

    inputs:
      - persons.json
      - helmets.json

    outputs:
      - report.txt

    artifact_sizes_mb:
      report.txt: 0.001
