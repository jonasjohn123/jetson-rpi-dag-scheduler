tasks:

  capture:
    command: "python workloads/vision/capture.py"
    preferred: camera

    inputs: []

    outputs:
      - frame.jpg

    artifact_sizes_mb:
      frame.jpg: 5

  preprocess:
    command: "python workloads/vision/preprocess.py"
    preferred: cpu

    inputs:
      - frame.jpg

    outputs:
      - tensor.npy
      - metadata.json

    artifact_sizes_mb:
      tensor.npy: 10
      metadata.json: 10

  detect:
    command: "python workloads/vision/detect.py"
    preferred: gpu

    inputs:
      - tensor.npy
      - metadata.json

    outputs:
      - boxes.json
      - confidence.json

    artifact_sizes_mb:
      boxes.json: 1
      confidence.json: 1

  log:
    command: "python workloads/vision/log.py"
    preferred: cpu

    inputs:
      - boxes.json
      - confidence.json

    outputs: []

    artifact_sizes_mb: {}

  generate:
    command: "python workloads/branching/generate.py"
    preferred: cpu

    inputs: []

    outputs:
      - data.bin

    artifact_sizes_mb:
      data.bin: 1


  branch_a:
    command: "python workloads/branching/branch_a.py"
    preferred: cpu

    inputs:
      - data.bin

    outputs:
      - result_a.bin

    artifact_sizes_mb:
      result_a.bin: 2


  branch_b:
    command: "python workloads/branching/branch_b.py"
    preferred: cpu

    inputs:
      - data.bin

    outputs:
      - result_b.bin

    artifact_sizes_mb:
      result_b.bin: 3


  merge:
    command: "python workloads/branching/merge.py"
    preferred: cpu

    inputs:
      - result_a.bin
      - result_b.bin

    outputs:
      - merged.txt

    artifact_sizes_mb:
      merged.txt: 0.001